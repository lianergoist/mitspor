# Bygning af MitSpor-appen i Codemagic (https://codemagic.io).
# Appen ligger i mappen mobile/. Hvert script starter i repoets rod.
# Bygninger startes manuelt i Codemagic (ingen automatiske triggers).

workflows:
  android-test:
    name: Android-testversion (APK)
    # Mac-maskinen er med i Codemagics gratis minutter og kan også bygge iOS senere.
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 22
      java: 21
    scripts:
      - name: Installér npm-pakker
        script: |
          cd mobile
          npm ci
      - name: Kopiér web-filer ind i Android-projektet
        script: |
          cd mobile
          npm run vendor
          npx cap sync android
      - name: Byg debug-APK
        script: |
          cd mobile/android
          ./gradlew assembleDebug
    artifacts:
      # Debug-APK'en er signeret med en midlertidig testnøgle og kan
      # installeres direkte på en Android-telefon (ikke til Google Play).
      - mobile/android/app/build/outputs/apk/debug/*.apk

  android-release:
    name: Android til Google Play (AAB)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 22
      java: 21
      android_signing:
        # Navnet på upload-nøglen under Personal Account → codemagic.yaml settings → Code signing identities → Android keystores
        - mitspor_upload
    scripts:
      - name: Vis upload-nøglens fingeraftryk
        script: |
          # Fingeraftrykket er offentligt og bruges i Play Console. Kodeordet vises ikke.
          keytool -list -v -keystore "$CM_KEYSTORE_PATH" -storepass "$CM_KEYSTORE_PASSWORD" -alias "$CM_KEY_ALIAS" \
            | grep -E "^\s*(SHA1|SHA256):"
      - name: Installér npm-pakker
        script: |
          cd mobile
          npm ci
      - name: Kopiér web-filer ind i Android-projektet
        script: |
          cd mobile
          npm run vendor
          npx cap sync android
      - name: Byg signeret AAB
        script: |
          cd mobile/android
          ./gradlew bundleRelease
    artifacts:
      # AAB-filen uploades manuelt i Play Console (første upload skal altid ske manuelt)
      - mobile/android/app/build/outputs/bundle/release/*.aab

  ios-testflight:
    name: iOS-testversion (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      # Navnet på API-nøglen under Personal Account → Integrations → Developer Portal
      app_store_connect: mitspor
    environment:
      node: 22
      xcode: latest
      ios_signing:
        # Certifikat og profil hentes fra Personal Account → codemagic.yaml settings → Code signing identities
        distribution_type: app_store
        bundle_identifier: dk.mitspor.app
    scripts:
      - name: Installér npm-pakker
        script: |
          cd mobile
          npm ci
      - name: Kopiér web-filer ind i iOS-projektet
        script: |
          cd mobile
          npm run vendor
          npx cap sync ios
      - name: Brug signeringsprofilen i Xcode-projektet
        script: xcode-project use-profiles
      - name: Sæt build-nummer
        # Codemagics løbenummer for workflowet, så hver bygning til TestFlight har et nyt nummer
        script: |
          cd mobile/ios/App
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Byg IPA
        script: |
          xcode-project build-ipa --project mobile/ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      # Hele xcodebuild-loggen, så fejl i arkiveringen kan ses
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Bygningen lægges i TestFlight til interne testere. Ingen ekstern
        # beta-gennemgang (den kræver testoplysninger i App Store Connect).
        submit_to_testflight: false

  ios-adhoc:
    name: iOS-testversion (ad hoc, til Diawi)
    # Til iPhones, der ikke kan køre TestFlight (kræver iOS 16).
    # Kun registrerede enheder kan installere bygningen.
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: mitspor
    environment:
      node: 22
      xcode: latest
      ios_signing:
        # Ad hoc-profilen skal indeholde telefonens UDID og hentes igen,
        # når der registreres nye enheder.
        distribution_type: ad_hoc
        bundle_identifier: dk.mitspor.app
    scripts:
      - name: Installér npm-pakker
        script: |
          cd mobile
          npm ci
      - name: Kopiér web-filer ind i iOS-projektet
        script: |
          cd mobile
          npm run vendor
          npx cap sync ios
      - name: Brug signeringsprofilen i Xcode-projektet
        script: xcode-project use-profiles
      - name: Sæt build-nummer
        # 1000 + løbenummeret, så en ad hoc-bygning aldrig kan forveksles med
        # en App Store-bygning (ios-testflight bruger løbenummeret direkte).
        # Ad hoc-bygninger kan ikke indsendes til Apple (ITMS-90035).
        script: |
          cd mobile/ios/App
          agvtool new-version -all "$((1000 + BUILD_NUMBER))"
      - name: Byg IPA
        script: |
          xcode-project build-ipa --project mobile/ios/App/App.xcodeproj --scheme App
    artifacts:
      # IPA'en hentes fra Codemagic og uploades manuelt til diawi.com
      - build/ios/ipa/*.ipa
      # Hele xcodebuild-loggen, så fejl i arkiveringen kan ses
      - /tmp/xcodebuild_logs/*.log
